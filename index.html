<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Scale Selector</title>
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
        <meta name="theme-color" content="#020617">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-title" content="Scales">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <link rel="stylesheet" href="output.css">
    </head>
    <body class="min-h-screen bg-slate-950 text-slate-100 antialiased pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)] pl-[env(safe-area-inset-left)] pr-[env(safe-area-inset-right)]">
        <main class="mx-auto max-w-3xl px-4 py-10">
            <header class="mb-8 text-center">
                <h1 class="text-3xl font-bold tracking-tight">Scale Selector</h1>
            </header>

            <section class="rounded-xl border border-slate-800 bg-slate-900 p-5 shadow-xl">
                <form class="flex flex-wrap items-center justify-between gap-3" onsubmit="event.preventDefault(); displayScales()">
                    <label class="flex items-center gap-2 text-sm text-slate-300">
                        Random picks
                        <input type="number" id="num-select" value="7" min="0"
                            class="h-11 w-20 rounded-md border border-slate-700 bg-slate-800 px-2 text-center text-base text-slate-100 focus:border-indigo-500 focus:outline-none">
                    </label>
                    <button type="submit"
                        class="h-11 rounded-md bg-indigo-600 px-6 text-base font-semibold text-white shadow hover:bg-indigo-500 active:bg-indigo-700">
                        Generate
                    </button>
                </form>

                <div class="mt-3 flex gap-4 text-xs text-slate-400">
                    <span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-indigo-500/60"></span>Always included</span>
                    <span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-amber-500/60"></span>Random pick</span>
                </div>

                <ol id="randomized-display" class="mt-4 grid gap-2 sm:grid-cols-2 md:grid-cols-3"></ol>
            </section>

            <details class="group mt-6 rounded-xl border border-slate-800 bg-slate-900 shadow-xl">
                <summary class="flex min-h-14 cursor-pointer select-none list-none items-center justify-between rounded-xl px-5 py-4 hover:bg-slate-800/50 active:bg-slate-800 [&::-webkit-details-marker]:hidden">
                    <span class="font-semibold">Scale selection</span>
                    <span class="flex items-center gap-3 text-sm text-slate-400">
                        <span id="selection-summary"></span>
                        <svg class="h-4 w-4 transition-transform group-open:rotate-180" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.06l3.71-3.83a.75.75 0 111.08 1.04l-4.25 4.39a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
                        </svg>
                    </span>
                </summary>
                <div class="border-t border-slate-800 p-5">
                    <p class="mb-4 text-sm text-slate-400">
                        <strong class="text-slate-300">Always</strong> scales appear every time.
                        The random picks are drawn from the <strong class="text-slate-300">pool</strong>.
                    </p>
                    <div id="scaleset"></div>
                    <div class="mt-4 text-right">
                        <button type="button" onclick="resetSettings()"
                            class="h-11 rounded-md border border-slate-700 px-4 text-sm text-slate-300 hover:bg-slate-800 active:bg-slate-700">
                            Reset to defaults
                        </button>
                    </div>
                </div>
            </details>
        </main>

        <script src="generateScales.js"></script>
        <script>
            applyScaleSetDisplay();
            initSettingsListeners();
            displayScales(); // generate a random list upon site load
        </script>
    </body>
</html>
